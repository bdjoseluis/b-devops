apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: aura-ops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: aura-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "true"
            - name: N8N_BASIC_AUTH_USER
              value: admin
            - name: N8N_BASIC_AUTH_PASSWORD
              value: CHANGE_ME_N8N_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              value: CHANGE_ME_32_CHAR_RANDOM_STRING
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: aura_ops
            - name: DB_POSTGRESDB_USER
              value: aura
            - name: DB_POSTGRESDB_PASSWORD
              value: CHANGE_ME_STRONG_PASSWORD
            - name: DB_POSTGRESDB_SCHEMA
              value: n8n
            - name: WEBHOOK_URL
              value: https://YOUR_DOMAIN/n8n/
            - name: N8N_PATH
              value: /n8n/
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: aura-ops
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
