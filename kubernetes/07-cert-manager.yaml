# ClusterIssuer Let's Encrypt — SSL gratuito automático
# Aplica esto DESPUÉS de instalar cert-manager:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   kubectl wait --for=condition=ready pod -l app=cert-manager -n cert-manager --timeout=120s
#   kubectl apply -f 07-cert-manager.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: TU_EMAIL@gmail.com    # ← cambia esto
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging   # Usa este para pruebas (sin límites de rate)
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: TU_EMAIL@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: traefik
