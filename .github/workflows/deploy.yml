name: Deploy B-DEVOPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    defaults:
      run:
        working-directory: D:\aura-ops
        shell: powershell

    steps:
      - name: Pull latest code
        run: |
          git pull origin main
          $commit = git log -1 --format='%h %s'
          Write-Host "Codigo actualizado: $commit"

      - name: Rebuild changed services
        run: |
          $ErrorActionPreference = 'Continue'
          $changed = git diff --name-only HEAD~1 HEAD 2>$null
          if (-not $changed) {
            $changed = git diff --name-only HEAD 2>$null
          }
          if (-not $changed) {
            Write-Host "Sin cambios detectados"
            exit 0
          }
          Write-Host "Archivos modificados: $($changed.Count)"

          $rebuildBackend  = @($changed | Where-Object { $_ -like "backend/*" })
          $rebuildFrontend = @($changed | Where-Object { $_ -like "frontend/*" })
          $rebuildCompose  = @($changed | Where-Object { $_ -eq "docker-compose.yml" })
          $rebuilt = $false

          if ($rebuildCompose.Count -gt 0) {
            Write-Host "docker-compose.yml cambiado - reconstruyendo todo el stack..."
            docker compose up -d --build
            $rebuilt = $true
          }
          else {
            if ($rebuildBackend.Count -gt 0) {
              Write-Host "Reconstruyendo backend (FastAPI)..."
              docker compose up -d --build bdev-backend
              $rebuilt = $true
            }
            if ($rebuildFrontend.Count -gt 0) {
              Write-Host "Reconstruyendo frontend (React)..."
              docker compose up -d --build bdev-frontend
              $rebuilt = $true
            }
          }

          if (-not $rebuilt) {
            Write-Host "Sin cambios en servicios Docker"
          }

      - name: Verify deployment
        run: |
          Start-Sleep -Seconds 20
          try {
            $r = Invoke-RestMethod -Uri "https://api.bdev.qzz.io/api/health" -TimeoutSec 10
            Write-Host "API OK - status: $($r.status) version: $($r.version)"
          }
          catch {
            Write-Host "Health check warning: $_"
          }

      - name: Stack status
        if: always()
        run: docker compose ps
