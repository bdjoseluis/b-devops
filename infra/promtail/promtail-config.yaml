server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://bdev-loki:3100/loki/api/v1/push
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # Nombre del contenedor (sin la barra inicial)
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Servicio de docker compose
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Imagen base
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: job
        replacement: docker/$1
      # Proyecto compose (bdev-ops)
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
    pipeline_stages:
      # Intentar parsear JSON (FastAPI, n8n, Traefik access log)
      - json:
          expressions:
            level: level
            msg: msg
            message: message
            time: time
      # Promover el campo level como label si existe
      - labels:
          level:
      # Timestamp desde el log si existe, si no usar el de ingesta
      - timestamp:
          source: time
          format: RFC3339
          fallback_formats:
            - "2006-01-02T15:04:05Z07:00"
            - "2006/01/02 15:04:05"
          action_on_failure: skip
