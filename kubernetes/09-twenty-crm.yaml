# Twenty CRM — open source Salesforce alternative
# UI: http://localhost/crm
# Docs: https://twenty.com/developers/self-hosting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-server
  namespace: bdev-ops
  labels:
    app: twenty-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-server
  template:
    metadata:
      labels:
        app: twenty-server
    spec:
      containers:
        - name: twenty-server
          image: twentycrm/twenty:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PG_DATABASE_URL
              value: "postgresql://bdev:bdev@postgres:5432/twenty_crm"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: STORAGE_TYPE
              value: "local"
            - name: APP_SECRET
              value: "changeme_twenty_secret_32chars_xx"
            - name: SERVER_URL
              value: "http://localhost/crm"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: twenty-server
  namespace: bdev-ops
spec:
  selector:
    app: twenty-server
  ports:
    - port: 3000
      targetPort: 3000
---
# Redis (requerido por Twenty)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bdev-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bdev-ops
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
