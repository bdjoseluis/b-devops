apiVersion: apps/v1
kind: Deployment
metadata:
  name: bdev-frontend
  namespace: bdev-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bdev-frontend
  template:
    metadata:
      labels:
        app: bdev-frontend
    spec:
      containers:
        - name: bdev-frontend
          image: bdev-frontend:local
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bdev-frontend
  namespace: bdev-ops
spec:
  selector:
    app: bdev-frontend
  ports:
    - port: 80
      targetPort: 80
